<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janmashtami Experience — Kushagra Innovations</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;padding:24px 14px 40px}
    .top{width:min(100%,900px);display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
    .title{font-size:clamp(20px,4vw,32px);font-weight:800}
    .back{color:#fff;text-decoration:none;border:1px solid #333;padding:10px 15px;border-radius:999px}
    .back:hover{border-color:#777}
    .stage{width:min(100%,800px);background:#000;border:1px solid #222;border-radius:22px;padding:10px;overflow:auto}
    #turtle-div{width:768px;height:768px;max-width:100%;margin:auto}
    #turtle-div svg{display:block;margin:auto;max-width:100%;height:auto}
    .note{width:min(100%,800px);text-align:center;color:#999;font-size:13px;margin-top:14px}
  </style>

  <!-- Brython executes Python directly in the browser. -->
  <script src="https://cdn.jsdelivr.net/npm/brython@3/brython.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>
</head>

<body onload="brython()">
  <div class="top">
    <div class="title">🦚 Janmashtami Experience</div>
    <a class="back" href="https://kushagrainnovations.github.io/">← Portfolio</a>
  </div>

  <div class="stage">
    <div id="turtle-div"></div>
  </div>

  <div class="note">
    Shri Krishna artwork rendered from the original Python Turtle program.
  </div>

  <script type="text/python" src="Krishna-Janmashtami.py"></script>
</body>
</html>
